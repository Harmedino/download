# Render Blueprint: New > Blueprint, pick this repo. Deploys the API from server/Dockerfile.
services:
  - type: web
    name: snapgrab-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Background removal loads an ONNX model and is CPU-heavy; 2 GB RAM is the practical minimum.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://your-app.vercel.app (comma-separate several)
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: VIDEO_BG_FPS
        value: "12"
